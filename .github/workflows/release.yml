name: Build and Release EXE

# Запускается ТОЛЬКО на пуш тега, начинающегося с 'v' (например, v2.4.0)
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        # Must match the Python the maintainer builds and tests with: the
        # frozen app installs the optional ML packages for ITS OWN X.Y
        # via "pip install --user" (see clipgen/transcription/deps.py).
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller==6.11.1 tqdm==4.67.1

    - name: Build EXE with PyInstaller
      # ClipGen.spec is the source of truth: transcription hidden imports,
      # heavy-ML excludes and VC-runtime DLL filtering all live there.
      # Do NOT replace this with a generic pyinstaller command line.
      run: |
        pyinstaller --clean ClipGen.spec

    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: dist/ClipGen.exe
        draft: false
        prerelease: false
        # Bilingual release notes; the in-app update dialog picks the
        # <!-- lang:xx --> block matching the user's UI language.
        body_path: RELEASE_NOTES.md
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
